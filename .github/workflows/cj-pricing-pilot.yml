name: CJ pricing pilot - safe checks
on:
  push:
    branches: ['dev/cj-bulk-pricing']
    paths: ['automation/**', '.github/workflows/cj-pricing-pilot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check pricing rules
        run: node automation/cj-bulk-pricing.mjs --self-test
      - name: Check CJ credentials without exposing response
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: |
          node --input-type=module <<'NODE'
          const key=process.env.CJ_API_KEY;
          if(!key){console.log('CJ_API_KEY not configured; live authentication skipped');process.exit(0)}
          const response=await fetch('https://developers.cjdropshipping.com/api2.0/v1/authentication/getAccessToken',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:key}),signal:AbortSignal.timeout(20000)});
          if(!response.ok){console.error('CJ authentication HTTP status: '+response.status);process.exit(1)}
          const r=await response.json();
          if(r.code!==200||!r.data?.accessToken){console.error('CJ authentication failed; verify API key and account authorization');process.exit(1)}
          console.log('CJ authentication passed; no token or account data written to logs');
          NODE
