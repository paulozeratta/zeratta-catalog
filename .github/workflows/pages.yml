name: Publicar catálogo Zeratta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zeratta-catalog-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos atualizados da main
        uses: actions/checkout@v4

      - name: Preparar site publico com dados editaveis
        run: |
          set -eu
          mkdir -p public
          cp index.html public/index.html
          mkdir -p public/precificacao
          cp precificacao/index.html public/precificacao/index.html
          mkdir -p public/data
          cp data/products.js data/pricing.json data/freights.json public/data/
          touch public/.nojekyll
          test -s public/index.html
          test -s public/precificacao/index.html
          test -s public/data/products.js
          test -s public/data/pricing.json
          test -s public/data/freights.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar catalogo e dados separados
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
