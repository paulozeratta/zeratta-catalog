name: Publicar catálogo Zeratta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: zeratta-catalog-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Baixar arquivos atualizados da main
        uses: actions/checkout@v4

      - name: Preparar site publico com conteudo criptografado
        run: |
          set -eu
          mkdir -p public
          cp index.html public/index.html
          touch public/.nojekyll
          test -s public/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar versao protegida
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
